<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Career Day</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172554;
      background: #eef5ff;
    }

    * { box-sizing: border-box; }

    .top-link {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1;
      padding: 10px 15px;
      color: #1e3a8a;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgb(30 64 175 / 20%);
      font-weight: 700;
      text-decoration: none;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      background: radial-gradient(circle at top right, #c7dfff, transparent 38%), #eef5ff;
    }

    main { width: min(100%, 900px); margin: 0 auto; }

    .hero {
      padding: clamp(30px, 6vw, 58px);
      color: #fff;
      background: linear-gradient(135deg, #1d4ed8, #2563eb 55%, #38bdf8);
      border-radius: 24px 24px 0 0;
    }

    .tag {
      display: inline-block;
      margin: 0 0 14px;
      padding: 6px 11px;
      border: 1px solid rgb(255 255 255 / 45%);
      border-radius: 999px;
      font-size: .86rem;
      font-weight: 700;
    }

    h1 { margin: 0; font-size: clamp(2.15rem, 7vw, 4rem); letter-spacing: -.04em; }
    .audience { margin: 14px 0 0; font-size: 1.05rem; }

    .content {
      padding: clamp(24px, 5vw, 42px);
      background: #fff;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 18px 42px rgb(30 64 175 / 14%);
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }

    .highlight {
      padding: 18px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
    }

    .highlight strong, dt { display: block; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
    .highlight strong { color: #2563eb; }
    .highlight span { display: block; margin-top: 7px; font-weight: 750; font-size: 1.1rem; }

    dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 0;
    }

    .detail { padding: 17px; border: 1px solid #dbeafe; border-radius: 14px; }
    dt { color: #64748b; }
    dd { margin: 7px 0 0; font-weight: 650; }

    @media (max-width: 640px) {
      .highlights, dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="top-link" href="event.html">Giới thiệu về tôi</a>
  <main>
    <section class="hero" aria-labelledby="event-title">
      <p class="tag">Dành cho sinh viên đại học</p>
      <h1 id="event-title">AI Career Day</h1>
      <p class="audience">Đối tượng: Sinh viên đại học</p>
    </section>

    <section class="content" aria-label="Thông tin sự kiện">
      <div class="highlights">
        <div class="highlight"><strong>Ngày</strong><span>15 tháng 11</span></div>
        <div class="highlight"><strong>Thời gian</strong><span>14:00–16:00</span></div>
        <div class="highlight"><strong>Hạn đăng ký</strong><span>10 tháng 11</span></div>
      </div>

      <dl>
        <div class="detail"><dt>Địa điểm</dt><dd>Phòng hội thảo A</dd></div>
        <div class="detail"><dt>Chi phí</dt><dd>Miễn phí</dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
